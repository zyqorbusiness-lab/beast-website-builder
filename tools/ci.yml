name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate repo structure
        run: node tools/validate.mjs
      - name: Install qa-harness browser (for the collision regression tests)
        working-directory: skills/qa-harness
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Smoke + regression tests (structure, guidance CLI, components, router modes, collision checks)
        run: npm test
        env:
          DISABLE_TELEMETRY: "1"
      - name: Legacy-scan the component library
        run: node tools/guidance.mjs legacy-scan components
