name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repo structure
        run: node tools/validate.mjs
      - name: Smoke tests (structure, guidance CLI, components)
        run: npm test
        env:
          DISABLE_TELEMETRY: "1"
      - name: Legacy-scan the component library
        run: node tools/guidance.mjs legacy-scan components
